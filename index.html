<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tự học Tin học THCS</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { background: #eef4f0; color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    background: #eef4f0; color: #17251f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; background: #ffffff; color: #17251f;
    border: 1px solid #d5e2da; border-radius: 16px; padding: 28px 20px 24px;
    text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.3; color: #17251f; }
  p.sub { margin: 0 0 20px; font-size: 1.05rem; color: #33463c; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.grade {
    min-height: 56px; font-size: 1.25rem; font-weight: 700;
    color: #ffffff; background: #0f766e; border: 2px solid #0f766e;
    border-radius: 12px; cursor: pointer; padding: 12px 8px;
  }
  button.grade:active { background: #0b5e57; }
  #msg {
    margin: 16px 0 0; padding: 12px; font-size: 1rem; line-height: 1.4;
    color: #7f1d1d; background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 10px;
  }
  #loading { font-size: 1.1rem; color: #17251f; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="picker">
  <h1>Tự học Tin học THCS</h1>
  <p class="sub">Em học lớp mấy?</p>
  <div class="grid">
    <button type="button" class="grade" data-grade="6">Lớp 6</button>
    <button type="button" class="grade" data-grade="7">Lớp 7</button>
    <button type="button" class="grade" data-grade="8">Lớp 8</button>
    <button type="button" class="grade" data-grade="9">Lớp 9</button>
  </div>
  <p id="msg" role="alert" hidden></p>
</main>
<p id="loading" hidden>Đang mở app…</p>
<script>
(function () {
  var GRADES = ["6", "7", "8", "9"];
  var picker = document.getElementById("picker");
  var loading = document.getElementById("loading");
  var msg = document.getElementById("msg");

  function isValid(g) { return GRADES.indexOf(g) !== -1; }

  function getStored() {
    try {
      var v = window.localStorage && window.localStorage.getItem("ontin_grade");
      return isValid(v) ? v : null;
    } catch (e) { return null; }
  }

  function save(g) {
    try { window.localStorage.setItem("ontin_grade", g); } catch (e) { /* localStorage bị chặn: vẫn chuyển được bằng nút/?grade= */ }
  }

  function getParam() {
    try {
      var p = new URLSearchParams(window.location.search).get("grade");
      return isValid(p) ? p : null;
    } catch (e) { return null; }
  }

  function showPicker() {
    if (loading) loading.hidden = true;
    if (picker) picker.hidden = false;
  }

  function showLoading(grade) {
    if (picker) picker.hidden = true;
    if (loading) { loading.textContent = "Đang mở app Lớp " + grade + "…"; loading.hidden = false; }
  }

  function showError(grade) {
    showPicker();
    if (msg) {
      msg.textContent = "Chưa mở được file khối " + grade + ", em báo thầy/cô nhé.";
      msg.hidden = false;
    }
  }

  function go(grade) {
    var url = "khoi-" + grade + ".html";
    try { window.location.replace(url); }
    catch (e) {
      try { window.location.href = url; } catch (e2) { /* jsdom/test: replace đã được ghi nhận */ }
    }
  }

  // Kiểm tra file khối trước khi chuyển.
  // - fetch trả về ok -> chuyển.
  // - fetch trả về 404/410 (đang online, lỗi rõ ràng) -> ở lại, báo lỗi.
  // - fetch bị reject (mất mạng / offline) hoặc timeout -> vẫn chuyển,
  //   vì file khối có thể đã nằm trong cache của service worker.
  // - Trạng thái lỗi khác (vd 405 HEAD) -> vẫn chuyển, không chặn học sinh.
  function checkAndGo(grade) {
    showLoading(grade);
    if (typeof fetch !== "function") { go(grade); return; }
    var settled = false;
    var controller = null;
    var timer = null;
    try {
      if (typeof AbortController !== "undefined") {
        controller = new AbortController();
        timer = setTimeout(function () { try { controller.abort(); } catch (e) {} }, 5000);
      }
    } catch (e) { controller = null; }
    var opts = { method: "HEAD", cache: "no-store" };
    if (controller) opts.signal = controller.signal;
    fetch("khoi-" + grade + ".html", opts).then(function (res) {
      if (settled) return; settled = true;
      if (timer) clearTimeout(timer);
      if (res && res.ok) { go(grade); }
      else if (res && (res.status === 404 || res.status === 410)) { showError(grade); }
      else { go(grade); }
    }).catch(function () {
      if (settled) return; settled = true;
      if (timer) clearTimeout(timer);
      go(grade); // lỗi mạng / offline / timeout: vẫn chuyển (cache SW có thể có file)
    });
  }

  var param = getParam();
  var target = param || getStored();
  if (param) save(param);
  if (target) {
    checkAndGo(target);
  } else {
    showPicker();
  }

  var buttons = document.querySelectorAll("button.grade");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () {
      var g = this.getAttribute("data-grade");
      if (!isValid(g)) return;
      save(g);
      checkAndGo(g);
    });
  }
})();
</script>
</body>
</html>
